<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Manor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0806;}
canvas{display:block;width:100%;height:100%;}
#hud{position:fixed;inset:0;pointer-events:none;display:none;font-family:'Times New Roman',serif;}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,240,200,.85);font-size:18px;text-shadow:0 0 5px #000;user-select:none;}
#inventory{position:absolute;bottom:20px;left:18px;background:rgba(8,5,2,.88);border:1px solid rgba(170,130,50,.4);border-radius:4px;padding:10px 16px 10px 13px;min-width:200px;}
.inv-t{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(170,130,50,.55);margin-bottom:6px;border-bottom:1px solid rgba(170,130,50,.2);padding-bottom:5px;}
.inv-r{display:flex;align-items:center;gap:9px;font-size:12px;color:rgba(215,195,150,.8);line-height:2.1;}
.bdg{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#2a1f0e;border:1px solid rgba(170,130,50,.35);transition:background .4s,box-shadow .4s;}
.bdg.have{background:#d4a017;box-shadow:0 0 6px rgba(212,160,23,.75);}
#fdisp{position:absolute;top:16px;right:18px;font-size:12px;letter-spacing:2px;color:rgba(200,175,120,.72);background:rgba(8,5,2,.62);padding:5px 14px;border-radius:3px;border:1px solid rgba(170,130,50,.22);}
#hint{position:absolute;top:64%;left:50%;transform:translateX(-50%);font-size:14px;color:#f0e4c4;white-space:nowrap;background:rgba(4,2,1,.78);padding:6px 18px;border-radius:3px;border:1px solid rgba(170,130,50,.28);opacity:0;transition:opacity .22s;}
#dmg{position:fixed;inset:0;background:rgba(200,0,0,0);pointer-events:none;z-index:50;transition:background .12s;}
#vig{position:fixed;inset:0;pointer-events:none;z-index:18;transition:background .6s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,0) 100%);}
#vig.chase{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 28%,rgba(150,0,0,.38) 62%,rgba(200,0,0,.75) 100%);}
#glitch{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,rgba(255,0,0,0.03) 0px,rgba(0,0,0,0) 2px,rgba(0,0,255,0.03) 4px);transition:opacity .12s;}
#heartbeat{position:fixed;top:16px;left:18px;pointer-events:none;z-index:20;width:28px;height:28px;opacity:0;transition:opacity .3s,transform .08s;}
#heartbeat svg{width:100%;height:100%;}
#note-ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);}
#note-paper{background:#f5f0e0;border-radius:3px;padding:28px 34px;max-width:380px;width:90%;font-family:'Times New Roman',serif;box-shadow:0 4px 40px rgba(0,0,0,.8);position:relative;transform:rotate(-1.2deg);}
#note-paper::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(100,80,40,.12) 28px,rgba(100,80,40,.12) 29px);border-radius:3px;pointer-events:none;}
#note-text{color:#2a1a08;font-size:15px;line-height:1.9;position:relative;white-space:pre-wrap;}
#note-close{display:block;margin:18px auto 0;padding:6px 22px;background:transparent;border:1px solid #8a6030;color:#8a6030;font-family:'Times New Roman',serif;font-size:13px;letter-spacing:2px;cursor:pointer;}
#flicker-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:16;transition:background .04s;}
#lkc{position:fixed;inset:0;background:rgba(2,1,0,0);pointer-events:none;transition:background .45s;z-index:28;}
#lkc.on{background:rgba(2,1,0,.92);}
#lks{position:fixed;inset:0;pointer-events:none;z-index:29;overflow:hidden;opacity:0;transition:opacity .45s;}
#lks.on{opacity:1;}
#lks::before{content:'';position:absolute;top:0;left:0;right:0;height:calc(50% - 14px);background:rgba(2,1,0,.95);}
#lks::after{content:'';position:absolute;bottom:0;left:0;right:0;height:calc(50% - 14px);background:rgba(2,1,0,.95);}
#lkh{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);font-family:'Times New Roman',serif;font-size:14px;letter-spacing:1px;color:rgba(215,195,150,.85);background:rgba(4,2,1,.72);padding:6px 18px;border-radius:3px;display:none;pointer-events:none;z-index:32;}
#pmsg{position:fixed;top:13px;left:50%;transform:translateX(-50%);color:rgba(255,240,200,.4);font-family:'Times New Roman',serif;font-size:13px;pointer-events:none;display:none;letter-spacing:1px;}
#err{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;color:#f87171;font-family:'Courier New',monospace;font-size:12px;padding:24px;text-align:center;z-index:9999;white-space:pre-wrap;overflow:auto;}
#loading{position:fixed;inset:0;background:#080503;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(180,150,90,.6);font-family:'Times New Roman',serif;font-size:14px;letter-spacing:3px;z-index:200;gap:14px;}
#lbar-w{width:180px;height:2px;background:rgba(180,150,90,.15);border-radius:1px;overflow:hidden;}
#lbar{height:100%;width:0%;background:rgba(200,160,80,.65);transition:width .25s;}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Times New Roman',serif;z-index:100;background:rgba(0,0,0,.93);}
.scr.show{display:flex;}
.scr h1{font-size:clamp(28px,5.5vw,52px);letter-spacing:5px;font-weight:normal;}
.scr .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin-top:-14px;}
.scr p{font-size:13px;text-align:center;line-height:2.2;max-width:480px;padding:0 16px;opacity:.75;}
.scr hr{width:160px;border:none;border-top:1px solid rgba(255,255,255,.18);margin:0;}
.scr button{margin-top:6px;padding:11px 36px;background:transparent;color:inherit;border:1px solid currentColor;font-family:'Times New Roman',serif;font-size:15px;letter-spacing:3px;cursor:pointer;transition:background .2s,color .2s;}
.scr button:hover{background:currentColor;color:#0a0604;}
#st{color:#cdb870;}#st h1{text-shadow:0 0 28px rgba(205,184,112,.4);}
#sgo{color:#d47070;}#sgo h1{text-shadow:0 0 28px rgba(220,80,80,.45);}
#scl{color:#80c890;}#scl h1{text-shadow:0 0 28px rgba(100,200,130,.45);}
</style>
</head>
<body>
<div id="loading"><span>L O A D I N G</span><div id="lbar-w"><div id="lbar"></div></div></div>
<canvas id="c"></canvas>
<div id="hud">
  <div id="crosshair">+</div>
  <div id="inventory">
    <div class="inv-t">Inventory</div>
    <div class="inv-r"><span class="bdg" id="b2f"></span><span id="l2f">2F Key &nbsp;<small style="color:rgba(120,100,60,.6)">— not found</small></span></div>
    <div class="inv-r"><span class="bdg" id="b1f"></span><span id="l1f">1F Key &nbsp;<small style="color:rgba(120,100,60,.6)">— not found</small></span></div>
  </div>
  <div id="fdisp">Floor — ?F</div>
  <div id="hint"></div>
</div>
<div id="vig"></div><div id="glitch"></div><div id="flicker-overlay"></div><div id="dmg"></div>
<div id="heartbeat"><svg viewBox="0 0 28 28" fill="none"><path d="M14 24s-9-6.5-9-12a5 5 0 0110 0 5 5 0 0110 0c0 5.5-11 12-11 12z" fill="rgba(220,50,50,0.85)"/></svg></div>
<div id="note-ui"><div id="note-paper"><div id="note-text"></div><button id="note-close">[ CLOSE ]</button></div></div>
<div id="lkc"></div><div id="lks"></div>
<div id="lkh">[ E ] ロッカーから出る</div>
<div id="pmsg">— Click to resume —</div>
<div id="err"></div>
<div id="st" class="scr show">
  <h1>The Manor</h1><div class="sub">— haunted escape —</div><hr>
  <p>3階に閉じ込められた。鍵を探し、玄関から脱出せよ。</p>
  <p style="font-size:11px;opacity:.45;letter-spacing:1px;line-height:2.4">WASD 移動 | マウス 視点 | E 調べる / ドア / ロッカー | ESC 停止</p>
  <button id="btn-s">ENTER</button>
</div>
<div id="sgo" class="scr"><h1>GAME OVER</h1><div class="sub">— she found you —</div><hr>
  <p id="go-msg">捕まった…</p><button id="btn-r">TRY AGAIN</button></div>
<div id="scl" class="scr"><h1>ESCAPED</h1><div class="sub">— you survived —</div><hr>
  <p>洋館から脱出した。</p><button id="btn-a">PLAY AGAIN</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="showErr('Three.js CDN failed')"></script>
<script>
function showErr(m){var e=document.getElementById('err');e.style.display='flex';e.textContent='ERROR:\n'+m;document.getElementById('loading').style.display='none';}
var _lb=document.getElementById('lbar'),_lp=0;
var _lt=setInterval(function(){_lp=Math.min(_lp+Math.random()*16,88);_lb.style.width=_lp+'%';},100);
window.addEventListener('load',function(){
  clearInterval(_lt);_lb.style.width='100%';
  if(typeof THREE==='undefined'){showErr('THREE undefined');return;}
  setTimeout(function(){try{G();}catch(ex){showErr(ex.message+'\n'+(ex.stack||''));}},260);
});

function G(){
/*
  =====================================================
  マップ設計

  フロア: 1F=Y0, 2F=Y5, 3F=Y10  FH=4  壁厚WT=0.3

  メインエリア: X=-9〜15, Z=-9〜15 (各フロア共通)
  部屋グリッド(3×3): CX[-5,3,11], CZ[-5,3,11]
  外壁: 上記範囲の4面

  階段室A(3F→2F): X=15〜23, Z=-9〜-1  ← 北東
  階段室B(2F→1F): X=15〜23, Z= 7〜15  ← 南東

  階段の仕組み(スロープ方式):
  - 各階段室の中心にスロープAABBを登録
  - プレイヤーがスロープAABB内にいるとき
    Z座標から目標Yを計算してスナップ
  - 見た目は10段のステップBoxを並べる

  階段室A: Z=-1(3F入口)→Z=-9(2F出口)
  階段室B: Z=7 (2F入口)→Z=15(1F出口)

  ドア:
  - 3F部屋C(Z=-5)側 X=15 にドア → 階段室Aへ (2FKeyで開く)
  - 2F部屋F(Z=11)側 X=15 にドア → 階段室Bへ (1FKeyで開く)
  - 1F西外壁 X=-9, Z=3 に脱出扉 (1FKeyで開く)

  幽霊: 各フロア1体、フロア外に出ない
  鍵: 2FKey=3F部屋G(-5,11), 1FKey=2F部屋A(-5,-5)
  =====================================================
*/

/* ─ 定数 ─ */
var PH=1.72, SPD=4.5, PRAD=0.3, MSENS=0.0018;
var IDIST=2.4, EDIST=0.95;
var EVDIST=9, EVANG=Math.PI/3;
var GSPD=1.4, GCSPD=3.5, CHASE_TO=3.0, CHASE_LOSE=16;
var FY=[0,5,10], FH=4.0, WT=0.3, FT=0.15, DW=2.0, DH=3.2;
var CX=[-5,3,11], CZ=[-5,3,11];

/* 階段スロープ定義 */
/* SA: Z=-1(高さ3F=10)→Z=-9(高さ2F=5)  X=15〜23 */
var SA={x1:15,x2:23,z1:-9,z2:-1, zHigh:-1,yHigh:FY[2], zLow:-9,yLow:FY[1]};
/* SB: Z=7 (高さ2F=5) →Z=15(高さ1F=0)  X=15〜23 */
var SB={x1:15,x2:23,z1:7,z2:15,  zHigh:7, yHigh:FY[1], zLow:15, yLow:FY[0]};

/* ─ 状態 ─ */
var gst='title';
var hasK2=false,hasK1=false,gotK2=false,gotK1=false;
var inLk=false,locked=false,pendE=false;
var yaw=0,pitch=0,cFloor=2,readingNote=false,flickerTimer=0;

/* ─ Renderer ─ */
var cv=document.getElementById('c');
var R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));
R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.0;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c0906);
scene.fog=new THREE.Fog(0x0c0906,1,30);
var cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,45);
window.addEventListener('resize',function(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});

/* ─ 照明 ─ */
var ambL=new THREE.AmbientLight(0xffe8c0,1.8); scene.add(ambL);
var dirL=new THREE.DirectionalLight(0xffd080,0.8); dirL.position.set(5,12,3); scene.add(dirL);

/* ─ テクスチャ生成 ─ */
function mkTex(fn,rep){
  var c2=document.createElement('canvas'); c2.width=128; c2.height=128;
  fn(c2.getContext('2d'));
  var t=new THREE.CanvasTexture(c2); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep||2,rep||1); return t;
}
var tFloor=mkTex(function(c){
  c.fillStyle='#221408'; c.fillRect(0,0,128,128);
  for(var i=0;i<16;i++){c.fillStyle='rgba(90,50,10,'+(0.05+Math.random()*.1)+')'; c.fillRect(i*8,0,4+Math.random()*4,128);}
  for(var y=0;y<128;y+=4){c.strokeStyle='rgba(0,0,0,.04)'; c.lineWidth=1; c.beginPath(); c.moveTo(0,y); c.lineTo(128,y); c.stroke();}
},3);
var tCeil=mkTex(function(c){
  c.fillStyle='#141010'; c.fillRect(0,0,128,128);
  for(var x=0;x<128;x+=32){c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(x,0,4,128);}
  for(var y=0;y<128;y+=32){c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(0,y,128,4);}
},3);
function mkWall(base){return mkTex(function(c){c.fillStyle=base; c.fillRect(0,0,128,128); for(var i=0;i<30;i++){c.fillStyle='rgba(0,0,0,'+(Math.random()*.07)+')'; c.fillRect(Math.random()*128,Math.random()*128,Math.random()*18,Math.random()*18);}},2);}
var tNote=mkTex(function(c){c.fillStyle='#e8e0c8'; c.fillRect(0,0,128,96); for(var y=14;y<96;y+=14){c.strokeStyle='rgba(80,60,30,.18)'; c.lineWidth=.8; c.beginPath(); c.moveTo(4,y); c.lineTo(124,y); c.stroke();}},1);

/* ─ マテリアル ─ */
var mF =new THREE.MeshLambertMaterial({map:tFloor});
var mC =new THREE.MeshLambertMaterial({map:tCeil});
var mW=[new THREE.MeshLambertMaterial({map:mkWall('#182416')}),
        new THREE.MeshLambertMaterial({map:mkWall('#201520')}),
        new THREE.MeshLambertMaterial({map:mkWall('#1e0f0f')})];
var mTr=new THREE.MeshLambertMaterial({color:0x5a3a10});
var mSt=new THREE.MeshLambertMaterial({map:tFloor});
var mDr=new THREE.MeshLambertMaterial({color:0x3c1e0a});
var mFr=new THREE.MeshLambertMaterial({color:0x5a3a10});
var mLk=new THREE.MeshLambertMaterial({color:0x2c3020});
var mFn=new THREE.MeshLambertMaterial({color:0x2c1c0a});
var mNt=new THREE.MeshLambertMaterial({map:tNote});

/* ─ ジオメトリヘルパー ─ */
var wallBoxes=[], slopeZones=[];

function mkM(x,y,z,w,h,d,mat){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); scene.add(m); return m;
}
function addWB(x,y,z,w,h,d){ wallBoxes.push({x1:x-w/2,x2:x+w/2,y1:y-h/2,y2:y+h/2,z1:z-d/2,z2:z+d/2}); }
function solid(x,y,z,w,h,d,mat){ mkM(x,y,z,w,h,d,mat); addWB(x,y,z,w,h,d); }

/* 床スラブ: 見た目+衝突AABB。AABBの上面=fy */
function slab(cx,cz,w,d,fy){
  mkM(cx,fy-FT/2,cz,w,FT,d,mF);
  mkM(cx,fy+FH+FT/2,cz,w,FT,d,mC);
  wallBoxes.push({x1:cx-w/2,x2:cx+w/2, y1:fy-FT,y2:fy, z1:cz-d/2,z2:cz+d/2, isSlab:true, slabY:fy});
}

/* 壁: 長さを両端でWT/2ずつ伸ばしてコーナーを確実に塞ぐ */
function wall(x,z,w,d,fy,fi){
  solid(x,fy+FH/2,z,w,FH,d,mW[fi]);
  mkM(x,fy+0.1, z,w+.01,.18,d+.01,mTr);
  mkM(x,fy+FH-.06,z,w+.01,.12,d+.01,mTr);
}
function wZ(zc,xS,xE,fy,fi){
  var w=xE-xS; if(w<.01)return;
  wall(xS+w/2, zc, w, WT, fy,fi);
}
function wX(xc,zS,zE,fy,fi){
  var d=zE-zS; if(d<.01)return;
  wall(xc, zS+d/2, WT, d, fy,fi);
}

/* =====================================================
   マップ構築
===================================================== */
[0,1,2].forEach(function(fi){
  var fy=FY[fi];

  /* 床・天井 */
  slab(3, 3, 24, 24, fy);      /* メインエリア X=-9〜15, Z=-9〜15 */
  slab(19,-5,  8,  8, fy);     /* 階段室A */
  slab(19,11,  8,  8, fy);     /* 階段室B */

  /* 外壁: 北・南・西・東すべてX=-9〜23, Z=-9〜15をカバー */
  wZ(-9+WT/2, -9, 23, fy,fi);   /* 北壁 Z=-9 */
  wZ(15-WT/2, -9, 23, fy,fi);   /* 南壁 Z=15 */
  wX(-9+WT/2, -9, 15, fy,fi);   /* 西壁 X=-9 */
  wX(23-WT/2, -9, 15, fy,fi);   /* 東壁 X=23 */

  /* 内壁 Z=-1 (上中境界): X=-9〜15、開口3箇所 */
  wZ(-1+WT/2, -9,           CX[0]-DW/2, fy,fi);
  wZ(-1+WT/2, CX[0]+DW/2,  CX[1]-DW/2, fy,fi);
  wZ(-1+WT/2, CX[1]+DW/2,  CX[2]-DW/2, fy,fi);
  wZ(-1+WT/2, CX[2]+DW/2,  15,          fy,fi);

  /* 内壁 Z=7 (中下境界): X=-9〜15、開口3箇所 */
  wZ( 7+WT/2, -9,           CX[0]-DW/2, fy,fi);
  wZ( 7+WT/2, CX[0]+DW/2,  CX[1]-DW/2, fy,fi);
  wZ( 7+WT/2, CX[1]+DW/2,  CX[2]-DW/2, fy,fi);
  wZ( 7+WT/2, CX[2]+DW/2,  15,          fy,fi);

  /* 内壁 X=-1 (左中境界): Z=-9〜15、開口3箇所 */
  wX(-1+WT/2, -9,           CZ[0]-DW/2, fy,fi);
  wX(-1+WT/2, CZ[0]+DW/2,  CZ[1]-DW/2, fy,fi);
  wX(-1+WT/2, CZ[1]+DW/2,  CZ[2]-DW/2, fy,fi);
  wX(-1+WT/2, CZ[2]+DW/2,  15,          fy,fi);

  /* 内壁 X=7 (中右境界): Z=-9〜15、開口3箇所 */
  wX( 7+WT/2, -9,           CZ[0]-DW/2, fy,fi);
  wX( 7+WT/2, CZ[0]+DW/2,  CZ[1]-DW/2, fy,fi);
  wX( 7+WT/2, CZ[1]+DW/2,  CZ[2]-DW/2, fy,fi);
  wX( 7+WT/2, CZ[2]+DW/2,  15,          fy,fi);

  /* X=15 仕切り壁: メインと階段室の境
     中段Z=-1〜7: 常に壁
     SA側 Z=-9〜-1: 3F=開口(Z=-5±1), 2F=全開口, 1F=壁
     SB側 Z=7〜15:  2F=開口(Z=11±1), 1F=全開口, 3F=壁
  */
  wX(15+WT/2, -1, 7, fy,fi); /* 中段 常に壁 */

  if(fi===2){      /* 3F */
    wX(15+WT/2, -9, -6, fy,fi);  /* SA北片 Z=-9〜-6 */
    wX(15+WT/2, -4, -1, fy,fi);  /* SA南片 Z=-4〜-1 */
    wX(15+WT/2,  7, 15, fy,fi);  /* SB: 壁 */
  } else if(fi===1){ /* 2F */
    /* SA側: 全開口(壁なし) */
    wX(15+WT/2,  7, 10, fy,fi);  /* SB北片 Z=7〜10 */
    wX(15+WT/2, 12, 15, fy,fi);  /* SB南片 Z=12〜15 */
  } else {           /* 1F */
    wX(15+WT/2, -9, -1, fy,fi);  /* SA: 壁 */
    /* SB側: 全開口(壁なし) */
  }
});

/* =====================================================
   階段 (見た目: ステップBox, 物理: スロープAABBで計算)

   スロープ方式の利点:
   - 隙間ゼロ・すり抜けゼロ
   - プレイヤーのZ座標から目標Yを線形補間するだけ
   - ステップBoxはあくまで見た目のみ(衝突なし)
===================================================== */
(function(){
  var mRl=new THREE.MeshLambertMaterial({color:0x4a2a08});

  function buildStair(s){
    /* s = SA or SB */
    var NS=10;
    var W=s.x2-s.x1-.1, CX2=(s.x1+s.x2)/2;
    var totalZ=Math.abs(s.zLow-s.zHigh);
    var stepDz=totalZ/NS;
    var stepDy=(s.yHigh-s.yLow)/NS;
    var zDir=(s.zLow>s.zHigh)?1:-1;

    /* 見た目のステップ */
    for(var i=0;i<NS;i++){
      var topY=s.yHigh-(i+1)*stepDy;
      var sz=s.zHigh+zDir*(i+0.5)*stepDz;
      mkM(CX2, topY-stepDy/2, sz, W, stepDy, stepDz, mSt); /* 見た目のみ */
    }

    /* 手すり */
    var mz=(s.zHigh+s.zLow)/2, my=(s.yHigh+s.yLow)/2+1.0;
    mkM(CX2-W/2+.1,my,mz,.08,.08,totalZ,mRl);
    mkM(CX2+W/2-.1,my,mz,.08,.08,totalZ,mRl);

    /* スロープゾーン登録 */
    slopeZones.push(s);
  }

  buildStair(SA);
  buildStair(SB);

  /* 階段室の天井 */
  [0,1,2].forEach(function(fi){
    mkM(19,FY[fi]+FH+FT/2,-5,8,FT,8,mC);
    mkM(19,FY[fi]+FH+FT/2,11,8,FT,8,mC);
  });
})();

/* =====================================================
   スロープY計算: プレイヤーのZ座標から目標Yを返す
   スロープ外はnullを返す
===================================================== */
function getSlopeY(pos){
  for(var i=0;i<slopeZones.length;i++){
    var s=slopeZones[i];
    if(pos.x<s.x1||pos.x>s.x2) continue;
    var zMin=Math.min(s.zHigh,s.zLow), zMax=Math.max(s.zHigh,s.zLow);
    if(pos.z<zMin||pos.z>zMax) continue;
    /* Z位置を0〜1に正規化 */
    var t=(pos.z-s.zHigh)/(s.zLow-s.zHigh);
    t=Math.max(0,Math.min(1,t));
    return s.yHigh+t*(s.yLow-s.yHigh);
  }
  return null;
}

/* ─ 斧メッシュ生成 ─
   頭に刺さった斧: 柄が上に伸び、刃が頭頂部から生える形
   axe グループの原点 = 頭への刺さり点
   rotY: 刃の向き角度（複数本をずらす用）
*/
function addAxe(g, offsetX, offsetZ, rotY){
  /* マテリアル */
  var mWood   = new THREE.MeshLambertMaterial({color:0x6b3d12}); /* 柄: 濃い木目茶 */
  var mWoodD  = new THREE.MeshLambertMaterial({color:0x3e2008}); /* 柄の節: 暗い茶 */
  var mMetal  = new THREE.MeshStandardMaterial({color:0x9a9a9a, metalness:0.8, roughness:0.3}); /* 刃: 金属 */
  var mMetalE = new THREE.MeshStandardMaterial({color:0xcccccc, metalness:1.0, roughness:0.1}); /* 刃先: 光沢 */
  var mBand   = new THREE.MeshStandardMaterial({color:0x555555, metalness:0.9, roughness:0.2}); /* 金属バンド */

  var axe = new THREE.Group();

  /* ── 柄 ──
     全長0.55。下端(刺さり口)が太く上端が細い。
     CylinderGeometry(radiusTop, radiusBottom, height, segments)
  */
  var handleMain = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.032, 0.55, 8), mWood
  );
  handleMain.position.y = 0.275; /* 柄の中心Y = 0.275 */
  axe.add(handleMain);

  /* 柄の節（中間のリング状の膨らみ） */
  var knot = new THREE.Mesh(
    new THREE.CylinderGeometry(0.026, 0.026, 0.04, 8), mWoodD
  );
  knot.position.y = 0.16;
  axe.add(knot);

  /* 柄の上端グリップ部（少し太め） */
  var grip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.022, 0.022, 0.07, 8), mWoodD
  );
  grip.position.y = 0.515;
  axe.add(grip);

  /* 柄と刃の接続部：金属バンド2本 */
  [0.04, 0.10].forEach(function(by){
    var band = new THREE.Mesh(
      new THREE.CylinderGeometry(0.038, 0.038, 0.022, 8), mBand
    );
    band.position.y = by;
    axe.add(band);
  });

  /* ── 刃 ──
     斧の刃: 台形シルエット
     上部が幅広（刃先）、下部が狭い（柄との接続部）
     BoxGeometry で台形に近い形を作り、上部を傾ける
  */
  /* 刃の本体: やや縦長の台形（上が広い） */
  var bladeMain = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0,  0.14, 0.18, 3, 1, false), /* 三角断面 */
    mMetal
  );
  bladeMain.rotation.y = Math.PI / 6; /* 三角の向きを調整 */
  bladeMain.rotation.z = Math.PI / 2; /* 横向きに */
  bladeMain.position.set(0.12, 0.07, 0); /* 刃が右側に張り出す */
  axe.add(bladeMain);

  /* 刃の上部（幅広部分） */
  var bladeTop = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.21, 0.03), mMetal
  );
  bladeTop.position.set(0.14, 0.10, 0);
  axe.add(bladeTop);

  /* 刃先（光沢エッジ） */
  var edge = new THREE.Mesh(
    new THREE.BoxGeometry(0.008, 0.23, 0.015), mMetalE
  );
  edge.position.set(0.17, 0.10, 0);
  axe.add(edge);

  /* 刃の下部（小さい返し刃） */
  var backSpike = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0, 0.04, 0.09, 3, 1, false), mMetal
  );
  backSpike.rotation.y = Math.PI;
  backSpike.rotation.z = -Math.PI / 2;
  backSpike.position.set(-0.09, 0.04, 0);
  axe.add(backSpike);

  /* ── 配置 ──
     頭頂部(Y=1.97)に刺さり、斜めに傾いた状態
     rotY で複数の斧の向きをずらす
  */
  axe.rotation.z = 0.25;          /* 少し斜め（刺さった感じ） */
  axe.rotation.y = rotY || 0;
  axe.position.set(offsetX, 1.97, offsetZ);
  g.add(axe);
}

  [-1,1].forEach(function(s){var ey=new THREE.Mesh(new THREE.SphereGeometry(.044,6,5),em); ey.position.set(s*.09,1.76,-.23); g.add(ey);});
  var eg=new THREE.PointLight(ec,0,2.8); eg.position.set(0,1.76,-.18); g.add(eg);
  g.userData.eg=eg; g.userData.em=em;

  /* 斧を axeCount 本刺す（rotY で各斧の向きをずらして見栄えよく） */
  if(axeCount>=1) addAxe(g,  0,     0,     0);                  /* 1本目: 正面向き */

  return g;

     構造:
     ・柄(shaft): 縦向きの円柱、握り部分は下
     ・斧頭(head): 柄の上端に対して「横向き」に取り付け
       - 正面から見ると「T字」または「下がり形」
       - 片側に大きな半円弧状の刃(cutting edge)
       - 反対側にスパイク(pick)
     ・血のり: 刃全体に赤い付着
  ════════════════════════════════════════════ */
  var axeG=new THREE.Group();

  var mWood  =new THREE.MeshLambertMaterial({color:0x5a3010});
  var mWoodD =new THREE.MeshLambertMaterial({color:0x3a1e08});
  var mMetal =new THREE.MeshStandardMaterial({color:0x7a7a7a,metalness:.9,roughness:.2});
  var mEdge  =new THREE.MeshStandardMaterial({color:0xcccccc,metalness:1.0,roughness:.05});
  var mBloodR=new THREE.MeshStandardMaterial({color:0xbb0000,metalness:.05,roughness:.9,transparent:true,opacity:.92});
  var mBand  =new THREE.MeshStandardMaterial({color:0x333333,metalness:.95,roughness:.15});

  /* 柄 — 縦向き、全長0.80m */
  var shaft=new THREE.Mesh(new THREE.CylinderGeometry(.028,.038,.80,10),mWood);
  shaft.position.y=.40;
  axeG.add(shaft);
  /* 柄の木目節 */
  [.18,.42,.64].forEach(function(py){
    var kn=new THREE.Mesh(new THREE.CylinderGeometry(.034,.034,.030,10),mWoodD);
    kn.position.y=py; axeG.add(kn);
  });
  /* 柄の下端グリップ（少し太め） */
  var grip=new THREE.Mesh(new THREE.CylinderGeometry(.040,.040,.08,10),mWoodD);
  grip.position.y=.04; axeG.add(grip);

  /* 柄と斧頭の接合部バンド */
  [.77,.82].forEach(function(py){
    var bd=new THREE.Mesh(new THREE.CylinderGeometry(.048,.048,.022,10),mBand);
    bd.position.y=py; axeG.add(bd);
  });

  /* ──────────────────────────────────────────
     斧頭 — 柄のY軸上端(Y≈0.82)に横向きで装着
     正面から見ると:
       左側: 大きな弧状の刃(幅0.36m)
       右側: 短いスパイク/ピック(幅0.12m)
     横から見ると: 薄い板状(厚み0.05m)
  ────────────────────────────────────────── */
  var headG=new THREE.Group();
  headG.position.set(0,.82,0);

  /* 斧頭の中心ブロック（柄への固定部） */
  var neck=new THREE.Mesh(new THREE.BoxGeometry(.12,.22,.06),mMetal);
  headG.add(neck);

  /* 刃側（左：大きな三日月形の刃）
     CylinderGeometry(rTop,rBot,h,seg) を Z軸回転で横向きにして
     刃の弧形を表現 */
  /* 刃の本体: 扇形に近い形を複数のBoxで近似 */
  /* 刃の主板 */
  var blade=new THREE.Mesh(new THREE.BoxGeometry(.36,.30,.04),mMetal);
  blade.position.set(-.15,0,0);
  headG.add(blade);
  /* 刃の弧形部分（上部が広がる） */
  var bladeTop=new THREE.Mesh(new THREE.BoxGeometry(.30,.10,.04),mMetal);
  bladeTop.position.set(-.18,.16,0);
  headG.add(bladeTop);
  /* 刃の弧形部分（下部が広がる） */
  var bladeBtm=new THREE.Mesh(new THREE.BoxGeometry(.26,.10,.04),mMetal);
  bladeBtm.position.set(-.17,-.16,0);
  headG.add(bladeBtm);
  /* 刃先のエッジ（光沢のある薄い部分） */
  var edge=new THREE.Mesh(new THREE.BoxGeometry(.012,.42,.03),mEdge);
  edge.position.set(-.33,0,0);
  headG.add(edge);
  /* 刃先の上下の反り（Fire Axe特有の形） */
  var edgeTop=new THREE.Mesh(new THREE.BoxGeometry(.012,.12,.03),mEdge);
  edgeTop.rotation.z=-.35;
  edgeTop.position.set(-.31,.24,0);
  headG.add(edgeTop);
  var edgeBtm=new THREE.Mesh(new THREE.BoxGeometry(.012,.12,.03),mEdge);
  edgeBtm.rotation.z=.35;
  edgeBtm.position.set(-.30,-.24,0);
  headG.add(edgeBtm);

  /* スパイク側（右：短いピック形状） */
  var pick=new THREE.Mesh(
    new THREE.CylinderGeometry(.012,.040,.18,6),mMetal
  );
  pick.rotation.z=-Math.PI/2;
  pick.position.set(.15,0,0);
  headG.add(pick);
  /* ピック先端 */
  var pickTip=new THREE.Mesh(
    new THREE.CylinderGeometry(.003,.012,.06,6),mEdge
  );
  pickTip.rotation.z=-Math.PI/2;
  pickTip.position.set(.27,0,0);
  headG.add(pickTip);

  /* 血のり（刃全体をべったり覆う） */
  var blood1=new THREE.Mesh(new THREE.BoxGeometry(.34,.28,.05),mBloodR);
  blood1.position.set(-.15,0,0);
  headG.add(blood1);
  var blood2=new THREE.Mesh(new THREE.BoxGeometry(.28,.08,.05),mBloodR);
  blood2.position.set(-.18,.16,0);
  headG.add(blood2);
  var blood3=new THREE.Mesh(new THREE.BoxGeometry(.24,.08,.05),mBloodR);
  blood3.position.set(-.17,-.16,0);
  headG.add(blood3);
  /* 血だれ */
  [-0.28,-0.20,-0.10,0.00].forEach(function(bx){
    var drop=new THREE.Mesh(
      new THREE.CylinderGeometry(.007,.002,.10,4),mBloodR
    );
    drop.position.set(bx,-.30,0); headG.add(drop);
  });

  axeG.add(headG);

  /* 斧全体を右手持ちポーズで配置
     ・柄を斜め前方に向ける
     ・斧頭が右肩付近に来るように */
  axeG.rotation.z=.18;
  axeG.rotation.x=.30;
  axeG.rotation.y=-.15;
  axeG.position.set(.34,.20,.28);
  g.add(axeG);

  /* 光源（目から赤い光） */
  var eg=new THREE.PointLight(0xff2200,0,4.0);
  eg.position.set(0,1.82,-.18); g.add(eg);
  g.userData.eg=eg;
  g.userData.em=mEye;

  return g;
}

var blackManMesh=mkBlackMan();
blackManMesh.position.set(-5,FY[0],11); /* 1F: 左下エリアにスポーン */
scene.add(blackManMesh);

var bm={
  mesh:     blackManMesh,
  fl:       0,           /* 1F固定 */
  sp:       1.1,         /* 巡回速度: プレイヤーより遅い */
  cp:       3.0,         /* 追跡速度 */
  evDist:   10,          /* 索敵距離 */
  evAng:    Math.PI/1.5, /* 視野角: 120度 */
  minDist:  2.0,         /* この距離以内は無条件発見 */
  state:   'patrol',
  path:    [],
  step:    0,
  stepT:   0,
  chaseT:  0,
  gt:      0
};

function runBlackMan(dt){
  bm.gt+=dt;
  var gp=bm.mesh.position;
  /* 1Fに固定（地面に立つ、わずかに浮遊なし） */
  gp.y=FY[0]+Math.abs(Math.sin(bm.gt*1.8))*.03;

  if(cFloor!==0){bm.state='patrol'; return;} /* 1F以外では停止 */
  if(inLk){bm.state='search'; return;}

  var dx=pPos.x-gp.x, dz=pPos.z-gp.z;
  var dxz=Math.sqrt(dx*dx+dz*dz);

  /* 発見判定 */
  if(bm.state==='patrol'){
    var gf=new THREE.Vector3(-Math.sin(bm.mesh.rotation.y),0,-Math.cos(bm.mesh.rotation.y));
    var dp=new THREE.Vector3(dx,0,dz);
    var ang=dp.length()>.001?dp.normalize().angleTo(gf):Math.PI;
    if((dxz<bm.evDist&&ang<bm.evAng)||dxz<bm.minDist){
      bm.state='chase'; sndAlert(); bm.chaseT=0;
    }
  }
  /* 追跡解除 */
  if(bm.state==='chase'){
    if(inLk){bm.state='search'; bm.chaseT=0;}
    else if(dxz>CHASE_LOSE){bm.state='patrol'; bm.chaseT=0; bm.path=[];}
    else if(dxz>=bm.evDist){
      bm.chaseT+=dt;
      if(bm.chaseT>=CHASE_TO){bm.state='search'; bm.chaseT=0; bm.path=[];}
    } else bm.chaseT=0;
  }
  if(bm.state==='search'&&Math.random()<.006) bm.state='patrol';

  /* ゲームオーバー判定 */
  if(dxz<EDIST){
    gameOver('bm'); return;
  }

  var wps=WPS[0]; /* 1Fのウェイポイント */
  if(bm.state==='patrol'||bm.state==='search'){
    if(bm.path.length===0||bm.step>=bm.path.length){
      var tgt=Math.floor(Math.random()*wps.length), cur=0, bd=1e9;
      for(var i=0;i<wps.length;i++){
        var dd=(wps[i].x-gp.x)*(wps[i].x-gp.x)+(wps[i].z-gp.z)*(wps[i].z-gp.z);
        if(dd<bd){bd=dd; cur=i;}
      }
      bm.path=[cur,tgt]; bm.step=0;
    }
    var nw=wps[bm.path[Math.min(bm.step,bm.path.length-1)]];
    var tw=new THREE.Vector3(nw.x-gp.x,0,nw.z-gp.z);
    if(tw.length()<.7){bm.step++; if(bm.step>=bm.path.length) bm.path=[];}
    else{tw.normalize(); gp.x+=tw.x*bm.sp*dt; gp.z+=tw.z*bm.sp*dt; bm.mesh.rotation.y=Math.atan2(tw.x,tw.z);}
    bm.mesh.userData.eg.intensity=0;
    bm.stepT-=dt;
    if(bm.stepT<=0){
      bm.stepT=.6+Math.random()*.3;
      /* 足音: 低めの周波数（男性的な重い音） */
      if(cFloor===0) sndStepHeavy(Math.max(0,1-dxz/24)*.45);
    }
  } else {
    /* 追跡: 直進 */
    if(dxz>.001){
      gp.x+=dx/dxz*bm.cp*dt;
      gp.z+=dz/dxz*bm.cp*dt;
      bm.mesh.rotation.y=Math.atan2(dx,dz);
    }
    bm.mesh.userData.eg.intensity=5;
    bm.stepT-=dt;
    if(bm.stepT<=0){
      bm.stepT=.28;
      if(cFloor===0) sndStepHeavy(Math.max(0,1-dxz/16)*1.2);
    }
  }
}

var vigEl=document.getElementById('vig'), glEl=document.getElementById('glitch'), flEl=document.getElementById('flicker-overlay');

function runGhost(gs,dt,fx){
  gs.gt+=dt;
  var gp=gs.mesh.position;
  gp.y=FY[gs.fl]+Math.sin(gs.gt*2)*.06;
  var dx=pPos.x-gp.x, dz=pPos.z-gp.z;
  var dxz=Math.sqrt(dx*dx+dz*dz);
  var df=Math.sqrt(dx*dx+(pPos.y-gp.y)*(pPos.y-gp.y)+dz*dz);
  var same=(cFloor===gs.fl);
  if(!same) gs.state='patrol';
  if(same&&!inLk&&gs.state==='patrol'){
    var gf=new THREE.Vector3(-Math.sin(gs.mesh.rotation.y),0,-Math.cos(gs.mesh.rotation.y));
    var dp=new THREE.Vector3(dx,0,dz);
    var ang=dp.length()>.001?dp.normalize().angleTo(gf):Math.PI;
    /* gs.evDist: 索敵距離, gs.evAng: 視野角, gs.minDist: 距離に関わらず発見 */
    if((dxz<gs.evDist&&ang<gs.evAng)||dxz<gs.minDist){gs.state='chase'; sndAlert(); gs.chaseT=0;}
  }
  if(gs.state==='chase'){
    if(!same||inLk){gs.state='search'; gs.chaseT=0;}
    else if(df>CHASE_LOSE){gs.state='patrol'; gs.chaseT=0; gs.path=[];}
    else if(dxz>=EVDIST){gs.chaseT+=dt; if(gs.chaseT>=CHASE_TO){gs.state='search'; gs.chaseT=0; gs.path=[];}}
    else gs.chaseT=0;
  }
  if(gs.state==='search'&&Math.random()<.008) gs.state='patrol';
  if(same&&!inLk&&dxz<EDIST){gameOver(gs.fl); return;}
  var wps=WPS[gs.fl];
  if(gs.state==='patrol'||gs.state==='search'){
    if(gs.path.length===0||gs.step>=gs.path.length){
      var tgt=Math.floor(Math.random()*wps.length), cur=0, bd=1e9;
      for(var i=0;i<wps.length;i++){var dd=(wps[i].x-gp.x)*(wps[i].x-gp.x)+(wps[i].z-gp.z)*(wps[i].z-gp.z); if(dd<bd){bd=dd; cur=i;}}
      gs.path=[cur,tgt]; gs.step=0;
    }
    var nw=wps[gs.path[Math.min(gs.step,gs.path.length-1)]];
    var tw=new THREE.Vector3(nw.x-gp.x,0,nw.z-gp.z);
    if(tw.length()<.7){gs.step++; if(gs.step>=gs.path.length) gs.path=[];}
    else{tw.normalize(); gp.x+=tw.x*gs.sp*dt; gp.z+=tw.z*gs.sp*dt; gs.mesh.rotation.y=Math.atan2(tw.x,tw.z);}
    gs.mesh.userData.eg.intensity=0; gs.mesh.userData.em.emissiveIntensity=1.2;
    gs.stepT-=dt;
    if(gs.stepT<=0){
      gs.stepT=.5+Math.random()*.2;
      /* 同フロアのみ、XZ距離で音量計算（最大28m→0、同フロア外は無音） */
      if(same) sndStep(Math.max(0,1-dxz/28)*.5);
    }
  } else {
    if(dxz>.001){gp.x+=dx/dxz*gs.cp*dt; gp.z+=dz/dxz*gs.cp*dt; gs.mesh.rotation.y=Math.atan2(dx,dz);}
    gs.mesh.userData.eg.intensity=6; gs.mesh.userData.em.emissiveIntensity=10;
    gs.stepT-=dt;
    if(gs.stepT<=0){
      gs.stepT=.22;
      /* 追跡中: 同フロアのみ、近いほど大きく（最大18m→0） */
      if(same) sndStep(Math.max(0,1-dxz/18)*1.4);
    }
  }
  if(fx){
    var pr=Math.max(0,1-df/12);
    glEl.style.opacity=(pr*.5).toFixed(2);
    flickerTimer+=dt;
    if(gs.state==='chase'){
      if(flickerTimer>.06+Math.random()*.08){flickerTimer=0; var fl=Math.random()<.22; ambL.intensity=fl?.3:1.8+pr*.4; dirL.intensity=fl?.1:.8; flEl.style.background=fl?'rgba(60,0,0,.28)':'rgba(0,0,0,0)';}
      R.toneMappingExposure=1.0+pr*.4; vigEl.classList.add('chase');
    } else {ambL.intensity=1.8; dirL.intensity=.8; flEl.style.background='rgba(0,0,0,0)'; R.toneMappingExposure=1.0; vigEl.classList.remove('chase');}
    playHB(gs.state==='chase'?Math.round(60+pr*110):(pr>.1?Math.round(pr*50):0));
  }
}

/* ─ Audio ─ */
var actx=null;
function getAC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)(); return actx;}
function sndStep(v){if(v<.01)return; try{var c=getAC(),L=Math.floor(c.sampleRate*.06),b=c.createBuffer(1,L,c.sampleRate),d=b.getChannelData(0); for(var i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.5); var src=c.createBufferSource(); src.buffer=b; var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=340; f.Q.value=2; var gn=c.createGain(); gn.gain.value=Math.min(v*3,2); src.connect(f); f.connect(gn); gn.connect(c.destination); src.start();}catch(e){}}
function sndAlert(){try{var c=getAC(),o=c.createOscillator(),gn=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(200,c.currentTime); o.frequency.exponentialRampToValueAtTime(70,c.currentTime+.7); gn.gain.setValueAtTime(.16,c.currentTime); gn.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7); o.connect(gn); gn.connect(c.destination); o.start(); o.stop(c.currentTime+.7);}catch(e){}}
function sndStepHeavy(v){
  if(v<.01)return;
  try{
    var c=getAC(),L=Math.floor(c.sampleRate*.09),b=c.createBuffer(1,L,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,1.8)*.8;
    var src=c.createBufferSource(); src.buffer=b;
    var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=160; f.Q.value=1.5;
    var gn=c.createGain(); gn.gain.value=Math.min(v*3.5,2.5);
    src.connect(f); f.connect(gn); gn.connect(c.destination); src.start();
  }catch(e){}
}
function sndPick(){try{var c=getAC(),o=c.createOscillator(),gn=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(440,c.currentTime); o.frequency.setValueAtTime(660,c.currentTime+.08); gn.gain.setValueAtTime(.12,c.currentTime); gn.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3); o.connect(gn); gn.connect(c.destination); o.start(); o.stop(c.currentTime+.3);}catch(e){}}
var hbIv=null, lastBPM=0;
var hbEl=document.getElementById('heartbeat');
function playHB(bpm){
  if(Math.abs(bpm-lastBPM)<4)return; lastBPM=bpm;
  if(hbIv)clearInterval(hbIv);
  if(bpm<=0){hbEl.style.opacity='0'; return;}
  hbEl.style.opacity=bpm>80?'1':'.55';
  hbIv=setInterval(function(){
    try{var c=getAC(),o=c.createOscillator(),gn=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(60,c.currentTime); o.frequency.exponentialRampToValueAtTime(28,c.currentTime+.18); gn.gain.setValueAtTime(.2,c.currentTime); gn.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22); o.connect(gn); gn.connect(c.destination); o.start(); o.stop(c.currentTime+.25);}catch(e){}
    hbEl.style.transform='scale(1.45)'; setTimeout(function(){hbEl.style.transform='scale(1)';},80);
  },60000/bpm);
}

});

/* =====================================================
   物理
   壁: XZ円押し出し (スラブはスキップ)
   Y:  スロープ内→スロープYにスナップ
       スロープ外→スラブのAABBから着地Y検索
===================================================== */
var pPos=new THREE.Vector3(-5,FY[2],-5);

function resolveWalls(pos){
  for(var i=0;i<wallBoxes.length;i++){
    var b=wallBoxes[i];
    if(b.isSlab)continue;
    if(pos.y+PH<b.y1||pos.y>b.y2+.05)continue;
    var nx=Math.max(b.x1,Math.min(pos.x,b.x2));
    var nz=Math.max(b.z1,Math.min(pos.z,b.z2));
    var dx=pos.x-nx, dz=pos.z-nz, dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<PRAD&&dist>.0001){pos.x+=(dx/dist)*(PRAD-dist); pos.z+=(dz/dist)*(PRAD-dist);}
  }
}

function getFloorY(pos){
  /* スロープゾーン内か確認 */
  var sy=getSlopeY(pos);
  if(sy!==null) return sy;
  /* スラブのAABBから着地Y検索 */
  var best=null;
  for(var i=0;i<wallBoxes.length;i++){
    var b=wallBoxes[i];
    if(!b.isSlab)continue;
    if(pos.x<b.x1||pos.x>b.x2||pos.z<b.z1||pos.z>b.z2)continue;
    if(b.slabY>pos.y+.5)continue; /* 頭上のスラブは無視 */
    if(best===null||b.slabY>best) best=b.slabY;
  }
  return best;
}

function updPlayer(dt){
  if(inLk||readingNote){
    cam.position.set(pPos.x,pPos.y+.55,pPos.z);
    cam.rotation.order='YXZ'; cam.rotation.y=yaw; cam.rotation.x=pitch; return;
  }
  var fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  var rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  var v=new THREE.Vector3();
  if(keys.w)v.addScaledVector(fw,1); if(keys.s)v.addScaledVector(fw,-1);
  if(keys.d)v.addScaledVector(rt,1); if(keys.a)v.addScaledVector(rt,-1);
  if(v.lengthSq()>0){v.normalize().multiplyScalar(SPD*dt); pPos.x+=v.x; pPos.z+=v.z; resolveWalls(pPos);}

  var ty=getFloorY(pPos);
  if(ty!==null){
    pPos.y+=(ty-pPos.y)*Math.min(dt*18,1);
  } else {
    pPos.y-=10*dt; /* 落下 */
    if(pPos.y<FY[0]-.5){pPos.y=FY[0];} /* 底面クランプ */
  }

  if(pPos.y<FY[0]+2.5)cFloor=0;
  else if(pPos.y<FY[1]+2.5)cFloor=1;
  else cFloor=2;

  cam.position.set(pPos.x,pPos.y+PH,pPos.z);
  cam.rotation.order='YXZ'; cam.rotation.y=yaw; cam.rotation.x=pitch;
}

function updKeyAnim(dt){
  if(!gotK2){km2.rotation.y+=dt*1.4; km2.position.y=FY[2]+.6+Math.sin(performance.now()*.003)*.07; kl2.position.copy(km2.position);}
  if(!gotK1){km1.rotation.y+=dt*1.4; km1.position.y=FY[1]+.6+Math.sin(performance.now()*.0025)*.07; kl1.position.copy(km1.position);}
}

/* ─ ロッカー ─ */
var lkc=document.getElementById('lkc'), lks=document.getElementById('lks'), lkh=document.getElementById('lkh');
function enterLk(lk){inLk=true; pPos.set(lk.x,lk.y-1.0,lk.z); lkc.classList.add('on'); lks.classList.add('on'); lkh.style.display='block'; document.getElementById('hint').style.opacity='0'; if(locked)document.exitPointerLock();}
function exitLk(){inLk=false; lkc.classList.remove('on'); lks.classList.remove('on'); lkh.style.display='none'; cv.requestPointerLock();}

/* ─ メモ ─ */
function openNote(t){readingNote=true; document.getElementById('note-text').textContent=t; document.getElementById('note-ui').style.display='flex'; if(locked)document.exitPointerLock();}
function closeNote(){readingNote=false; document.getElementById('note-ui').style.display='none'; cv.requestPointerLock();}
document.getElementById('note-close').addEventListener('click',closeNote);

/* ─ インタラクション ─ */
var hEl=document.getElementById('hint');
var b2f=document.getElementById('b2f'), b1f=document.getElementById('b1f');
var l2f=document.getElementById('l2f'), l1f=document.getElementById('l1f');
var fdEl=document.getElementById('fdisp');
function shH(t){hEl.textContent=t; hEl.style.opacity='1';}
function hhH(){hEl.style.opacity='0';}

function updIA(){
  if(inLk){if(pendE)exitLk(); pendE=false; return;}
  if(readingNote){pendE=false; return;}
  var pp=cam.position, shown=false;

  if(!gotK2&&pp.distanceTo(km2.position)<IDIST){
    shH('[E] 2F Key を拾う'); shown=true;
    if(pendE){gotK2=true; hasK2=true; km2.visible=false; kl2.visible=false; b2f.classList.add('have'); l2f.innerHTML='2F Key &nbsp;<small style="color:#d4a017">— collected</small>'; shH('2F Key を入手！'); sndPick(); setTimeout(hhH,2000);}
  }
  if(!gotK1&&pp.distanceTo(km1.position)<IDIST){
    shH('[E] 1F Key を拾う'); shown=true;
    if(pendE){gotK1=true; hasK1=true; km1.visible=false; kl1.visible=false; b1f.classList.add('have'); l1f.innerHTML='1F Key &nbsp;<small style="color:#60a8d8">— collected</small>'; shH('1F Key を入手！'); sndPick(); setTimeout(hhH,2000);}
  }

  /* 階段ドア */
  if(cFloor===2){
    var dA=new THREE.Vector3(15,FY[2]+DH/2,-5);
    if(pp.distanceTo(dA)<IDIST+2){shown=true;
      if(!hasK2)shH('鍵がない… (2F Key が必要)');
      else if(dst.a===0){shH('[E] 2階へのドアを開ける'); if(pendE)dst.a=.001;}
      else shH('2階の階段へ →');}
  }
  if(cFloor===1){
    var dB=new THREE.Vector3(15,FY[1]+DH/2,11);
    if(pp.distanceTo(dB)<IDIST+2){shown=true;
      if(!hasK1)shH('鍵がない… (1F Key が必要)');
      else if(dst.b===0){shH('[E] 1階へのドアを開ける'); if(pendE)dst.b=.001;}
      else shH('1階の階段へ →');}
  }
  if(cFloor===0){
    var dX=new THREE.Vector3(-9,FY[0]+DH/2,3);
    if(pp.distanceTo(dX)<IDIST+2){shown=true;
      if(!hasK1)shH('鍵がない… (1F Key が必要)');
      else if(dst.x===0){shH('[E] 玄関を開ける！'); if(pendE)dst.x=.001;}
      else{shH('[E] 脱出する！'); if(pendE)gameClear();}}
  }

  var nl=null, nd=IDIST;
  lockers.forEach(function(lk){var d=pp.distanceTo(new THREE.Vector3(lk.x,lk.y,lk.z)); if(d<nd){nd=d; nl=lk;}});
  if(nl){shown=true; shH('[E] ロッカーに隠れる'); if(pendE)enterLk(nl);}

  if(!shown){
    var nn=null, nnd=IDIST;
    noteObjs.forEach(function(n){var d=pp.distanceTo(new THREE.Vector3(n.x,n.y,n.z)); if(d<nnd){nnd=d; nn=n;}});
    if(nn){shown=true; shH('[E] メモを読む'); if(pendE)openNote(nn.txt);}
  }
  if(!shown)hhH();
  pendE=false;
}
function updFloor(){fdEl.textContent='Floor — '+(cFloor+1)+'F';}

/* ─ ゲーム状態 ─ */
var dmgEl=document.getElementById('dmg');
function gameOver(fl){
  if(gst!=='playing')return; gst='gameover';  if(hbIv)clearInterval(hbIv); hbEl.style.opacity='0';
  dmgEl.style.background='rgba(210,0,0,.65)'; setTimeout(function(){dmgEl.style.background='rgba(210,0,0,0)';},180);
  if(document.pointerLockElement)document.exitPointerLock();
  document.getElementById('hud').style.display='none';
  vigEl.classList.remove('chase'); glEl.style.opacity='0'; flEl.style.background='rgba(0,0,0,0)';
  ambL.intensity=1.8; dirL.intensity=.8;
  document.getElementById('go-msg').textContent=
    fl==='bm' ? '1Fの黒い男に捕まった…' :
    (['1Fの彼女に捕まった…','2Fの彼女に捕まった…','3Fの彼女に捕まった…'][fl]||'捕まった…');
  setTimeout(function(){showS('sgo');},400);
}
function gameClear(){
  if(gst!=='playing')return; gst='clear';
  if(hbIv)clearInterval(hbIv); hbEl.style.opacity='0';
  if(document.pointerLockElement)document.exitPointerLock();
  document.getElementById('hud').style.display='none'; showS('scl');
}
function showS(id){
  ['st','sgo','scl'].forEach(function(s){document.getElementById(s).classList.remove('show');});
  if(id)document.getElementById(id).classList.add('show');
}

function startGame(){
  hasK2=false; hasK1=false; gotK2=false; gotK1=false;
  inLk=false; readingNote=false; pendE=false; gst='playing';
  yaw=Math.PI*.5; pitch=0; cFloor=2; flickerTimer=0;
  pPos.set(-5,FY[2],-5);
  ghosts[0].mesh.position.set(11,FY[2],11); ghosts[0].state='patrol'; ghosts[0].path=[]; ghosts[0].chaseT=0;
  ghosts[1].mesh.position.set(11,FY[1],-5); ghosts[1].state='patrol'; ghosts[1].path=[]; ghosts[1].chaseT=0;
  ghosts[2].mesh.position.set(11,FY[0],11); ghosts[2].state='patrol'; ghosts[2].path=[]; ghosts[2].chaseT=0;
  ghosts.forEach(function(gs){gs.mesh.userData.eg.intensity=0;});
  /* 黒い男リセット */
  bm.mesh.position.set(-5,FY[0],11); bm.state='patrol'; bm.path=[]; bm.chaseT=0; bm.mesh.userData.eg.intensity=0;
  vigEl.classList.remove('chase'); glEl.style.opacity='0'; flEl.style.background='rgba(0,0,0,0)';
  ambL.intensity=1.8; dirL.intensity=.8; R.toneMappingExposure=1.0;
  dst.a=0; dst.b=0; dst.x=0; pivA.rotation.y=0; pivB.rotation.y=0; pivX.rotation.y=0;
  km2.visible=true; kl2.visible=true; km2.position.set(-5,FY[2]+.6,11);
  km1.visible=true; kl1.visible=true; km1.position.set(-5,FY[1]+.6,-5);
  b2f.classList.remove('have'); b1f.classList.remove('have');
  l2f.innerHTML='2F Key &nbsp;<small style="color:rgba(120,100,60,.6)">— not found</small>';
  l1f.innerHTML='1F Key &nbsp;<small style="color:rgba(120,100,60,.6)">— not found</small>';
  lkc.classList.remove('on'); lks.classList.remove('on'); lkh.style.display='none';
  document.getElementById('note-ui').style.display='none';
  hbEl.style.opacity='0'; lastBPM=0; keys.w=keys.a=keys.s=keys.d=0;
  showS(null); document.getElementById('hud').style.display='block';
  document.getElementById('pmsg').style.display='none'; cv.requestPointerLock();
}
document.getElementById('btn-s').addEventListener('click',startGame);
document.getElementById('btn-r').addEventListener('click',startGame);
document.getElementById('btn-a').addEventListener('click',startGame);

var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),.05);
  if(gst==='playing'){
    updPlayer(dt);
    var minD=999, minI=0;
    ghosts.forEach(function(gs,i){var d=gs.mesh.position.distanceTo(pPos); if(d<minD){minD=d; minI=i;}});
    ghosts.forEach(function(gs,i){runGhost(gs,dt,i===minI);});
    runBlackMan(dt);
    updKeyAnim(dt); updDoors(dt); updIA(); updFloor();
  }
  R.render(scene,cam);
}
document.getElementById('loading').style.display='none';
animate();
} // end G()
</script>
</body>
</html>
