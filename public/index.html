<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆弾：九つの尻尾 / Nine Tails</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing:border-box; }
body { background:#080808; color:#d1d5db; font-family:'Courier New',Courier,monospace; margin:0; min-height:100vh; }

/* スキャンライン */
body::before {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.12) 2px,rgba(0,0,0,0.12) 4px);
  pointer-events:none; z-index:200;
}

/* カーソル点滅 */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.cursor-blink {
  display:inline-block; width:2px; height:1.1em;
  background:#ef4444; vertical-align:text-bottom; margin-left:2px;
  animation:blink 0.8s step-end infinite;
}

/* フラッシュ */
@keyframes flashRed { 0%{background-color:rgba(220,38,38,0.2)} 100%{background-color:transparent} }
.flash-red { animation:flashRed 0.6s ease-out forwards; }

/* 尻尾インジケーター */
.tail { width:20px; height:20px; border-radius:50%; border:2px solid #374151; transition:all 0.4s; flex-shrink:0; }
.tail.inactive { border-color:#374151; background:transparent; }
.tail.answered { border-color:#d97706; background:#78350f; box-shadow:0 0 6px rgba(245,158,11,0.5); }
@keyframes pulse_tail { 0%,100%{opacity:1;box-shadow:0 0 10px rgba(239,68,68,0.7)} 50%{opacity:0.6;box-shadow:0 0 4px rgba(239,68,68,0.3)} }
.tail.current { border-color:#ef4444; background:#7f1d1d; animation:pulse_tail 2s ease-in-out infinite; }

/* 選択肢ボタン */
.choice-btn {
  width:100%; text-align:left; padding:10px 14px;
  border:1px solid #374151; border-radius:4px;
  background:transparent; color:#d1d5db; font-family:'Courier New',monospace; font-size:12px;
  cursor:pointer; transition:all 0.15s; margin-bottom:6px; display:block;
}
.choice-btn:hover:not(:disabled) { border-color:#b91c1c; background:#450a0a; color:#fff; }
.choice-btn:disabled { opacity:0.35; cursor:not-allowed; }
.choice-btn.selected { border-color:#dc2626; background:#450a0a; color:#fff; box-shadow:0 0 8px rgba(220,38,38,0.3); }

/* スクロールバー */
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:#111; }
::-webkit-scrollbar-thumb { background:#374151; border-radius:2px; }

/* ========== 取調室レイアウト ========== */
#interrogation-room {
  display:flex; flex-direction:column; min-height:100vh;
  background: linear-gradient(180deg, #050505 0%, #0a0805 60%, #0d0a06 100%);
}

/* 上部：照明＋タゴサクエリア */
#room-top {
  display:flex; flex-direction:column; align-items:center;
  padding:16px 0 0;
  background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(180,120,40,0.12) 0%, transparent 70%);
}

/* 吊り電球 */
#lamp {
  width:2px; height:32px; background:linear-gradient(to bottom,#1a1a1a,#555);
  margin:0 auto; position:relative;
}
#lamp::after {
  content:''; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
  width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle, #ffe08a 0%, #d97706 50%, #78350f 100%);
  box-shadow:0 0 30px 12px rgba(217,119,6,0.25), 0 0 80px 30px rgba(217,119,6,0.08);
}
@keyframes lamp_flicker {
  0%,100%{opacity:1} 3%{opacity:0.85} 6%{opacity:1} 50%{opacity:0.97} 53%{opacity:0.88} 56%{opacity:1}
}
#lamp { animation:lamp_flicker 8s ease-in-out infinite; }

/* タゴサクの顔（アスキーアート） */
#tagosaku-face {
  margin-top:18px;
  font-family:'Courier New',monospace;
  font-size:11px; line-height:1.3;
  color:#5a4a30;
  text-align:center;
  text-shadow:0 0 12px rgba(200,150,50,0.2);
  transition:color 0.6s;
  user-select:none;
  white-space:pre;
}
#tagosaku-face.speaking { color:#8a7050; text-shadow:0 0 16px rgba(200,150,50,0.35); }
#tagosaku-face.reacting { color:#a06030; text-shadow:0 0 20px rgba(200,100,30,0.4); }

/* 机 */
#desk {
  width:100%; max-width:680px;
  height:14px; margin-top:20px;
  background:linear-gradient(to bottom, #1a1208, #0f0c06);
  border-top:2px solid #2a1f0e;
  border-radius:2px 2px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,200,80,0.05);
  position:relative;
}
#desk::before {
  content:''; position:absolute; top:2px; left:10%; width:80%; height:1px;
  background:linear-gradient(to right, transparent, rgba(200,150,50,0.08), transparent);
}

/* 下部：ゲームUI */
#room-bottom {
  flex:1; background:#0a0a0a;
  border-top:1px solid #1a1208;
  padding:16px;
  display:flex; flex-direction:column; align-items:center;
}
#game-ui { width:100%; max-width:640px; display:flex; flex-direction:column; gap:14px; }

/* セリフボックス */
#dialog-area {
  min-height:120px; padding:14px 18px;
  border:1px solid #1f2937; border-radius:4px;
  background:#0d0d0d; color:#e5e7eb;
  font-size:13px; line-height:2; white-space:pre-wrap;
  text-shadow:0 0 8px rgba(200,200,200,0.1);
}
#dialog-header {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
#dialog-dot { width:6px; height:6px; border-radius:50%; background:#ef4444; flex-shrink:0; }
@keyframes dot_pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
#dialog-dot.active { animation:dot_pulse 1.2s ease-in-out infinite; }

/* 入力エリア */
#input-area { display:flex; flex-direction:column; gap:8px; }

/* タイマーバー */
#timer-bar { transition:width 1s linear; }
</style>
</head>
<body>

<!-- ========== 取調室の固定フレーム ========== -->
<div id="interrogation-room">
  <div id="room-top">
    <div id="lamp"></div>
    <!-- タゴサクの顔 -->
    <div id="tagosaku-face">
 ___________________
|                   |
|   .-----.-----.   |
|   | o   |   o |   |
|   '-----'-----'   |
|      _______      |
|     |       |     |
|  \__|_______|__/  |
|___________________|
    ███████████████
    </div>
    <div id="desk"></div>
  </div>
  <div id="room-bottom">
    <div id="game-ui">
      <!-- ここにJSで各フェーズを描画 -->
    </div>
  </div>
</div>

<script>
// ============================================================
//  タゴサクの顔パターン
// ============================================================
const TAGO_FACE = {
  neutral: `  ___________
 /           \\
| ◉         ◉ |
|      ___    |
|     (   )   |
|      ---    |
 \\___________/
   |  | |  |
   ████████`,

  talking: `  ___________
 /           \\
| ◉         ◉ |
|      ___    |
|    (     )  |
|     \\ ∪ /   |
 \\___________/
   |  | |  |
   ████████`,

  laughing: `  ___________
 /           \\
| ◈         ◈ |
|             |
|   ≧ ▽ ≦   |
|             |
 \\___________/
   |  | |  |
   ████████`,

  staring: `  ___________
 /           \\
| ●         ● |
|             |
|      ___    |
|     ─────   |
 \\___________/
   |  | |  |
   ████████`,

  smiling: `  ___________
 /           \\
| ◉         ◉ |
|             |
|    ╰──╯    |
|             |
 \\___________/
   |  | |  |
   ████████`,
};

function setFace(type) {
  const el = document.getElementById("tagosaku-face");
  if (!el) return;
  el.textContent = TAGO_FACE[type] || TAGO_FACE.neutral;
  el.className = (type === "talking" || type === "laughing") ? "speaking" : "";
  if (type === "laughing") el.classList.add("reacting");
}
</script>
